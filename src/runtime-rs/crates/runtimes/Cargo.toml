[package]
name = "runtimes"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
lazy_static = { workspace = true }
netns-rs = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
containerd-shim-protos = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { version = "0.18.0", features = [
    "rt-tokio-current-thread",
    "trace",
    "rt-tokio",
] }
opentelemetry-jaeger = { workspace = true, features = [
    "rt-tokio",
    "collector_client",
    "isahc_collector_client",
] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
hyper = { workspace = true, features = ["stream", "server", "http1"] }
serde_json = { workspace = true }
nix = { workspace = true }
url = { workspace = true }
procfs = { workspace = true }
futures = { workspace = true }
prometheus = { workspace = true }
oci-spec = { workspace = true }

# Local dependencies
agent = { workspace = true }
common = { workspace = true }
kata-types = { workspace = true }
protocols = { workspace = true }
protobuf = { workspace = true }
kata-sys-util = { workspace = true }
logging = { workspace = true }
runtime-spec = { workspace = true }
shim-interface = { workspace = true }
persist = { workspace = true }
kata-hypervisor = { workspace = true }
resource = { workspace = true }

# Local dependencies: runtime handler
linux_container = { workspace = true, optional = true }
virt_container = { workspace = true, optional = true }
wasm_container = { workspace = true, optional = true }

[features]
default = ["virt"]
linux = ["linux_container"]
virt = ["virt_container"]
wasm = ["wasm_container"]

dragonball = ["virt_container/dragonball"]
cloud-hypervisor = ["virt_container/cloud-hypervisor"]
