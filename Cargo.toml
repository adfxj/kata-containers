[workspace.package]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
edition = "2018"
license = "Apache-2.0"
rust-version = "1.88"

[workspace]
members = [
  # libs
  "src/libs/kata-sys-util",
  "src/libs/kata-types",
  "src/libs/logging",
  "src/libs/mem-agent",
  "src/libs/pod-resources-rs",
  "src/libs/protocols",
  "src/libs/runtime-spec",
  "src/libs/safe-path",
  "src/libs/shim-interface",
  "src/libs/test-utils",

  # kata-agent
  "src/agent",
  "src/agent/rustjail",
  "src/agent/policy",
  "src/agent/vsock-exporter",

  # Dragonball
  "src/dragonball",
  "src/dragonball/dbs_acpi",
  "src/dragonball/dbs_address_space",
  "src/dragonball/dbs_allocator",
  "src/dragonball/dbs_arch",
  "src/dragonball/dbs_boot",
  "src/dragonball/dbs_device",
  "src/dragonball/dbs_interrupt",
  "src/dragonball/dbs_legacy_devices",
  "src/dragonball/dbs_pci",
  "src/dragonball/dbs_tdx",
  "src/dragonball/dbs_upcall",
  "src/dragonball/dbs_utils",
  "src/dragonball/dbs_virtio_devices",

  # cloud-hypervisors
  "src/cloud-hypervisor/vmm",

  # tools
  "src/tools/agent-ctl",
  "src/tools/genpolicy",
  "src/tools/kata-ctl",
  "src/tools/trace-forwarder",

  # kata-deploy (Kubernetes installer binary)
  "tools/packaging/kata-deploy/binary",

  # runtime-rs
  "src/runtime-rs",
  "src/runtime-rs/crates/agent",
  "src/runtime-rs/crates/hypervisor",
  "src/runtime-rs/crates/persist",
  "src/runtime-rs/crates/resource",
  "src/runtime-rs/crates/runtimes",
  "src/runtime-rs/crates/service",
  "src/runtime-rs/crates/shim",
  "src/runtime-rs/crates/shim-ctl",
  "src/runtime-rs/tests/utils",
]
resolver = "2"

# TODO: Add all excluded crates to root workspace
exclude = [
  "src/tools",

  # We are cloning and building rust packages under
  # "tools/packaging/kata-deploy/local-build/build" folder, which may mislead
  # those packages to think they are part of the kata root workspace
  "tools/packaging/kata-deploy/local-build/build",
]

[workspace.dependencies]
# Rust-VMM crates
event-manager = "0.4.0"
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
linux-loader = "0.13.0"
seccompiler = "0.5.0"
vfio-bindings = "0.6.2"
vfio-ioctls = "0.6.0"
virtio-bindings = "0.2.0"
virtio-queue = "0.17.0"
vm-fdt = "0.3.0"
vm-memory = "=0.17.1"
vm-superio = "0.8.0"
vmm-sys-util = "0.15.0"

# cloud-hypervisor rust-vmm crates
acpi_tables = "0.2.0"
iommufd-ioctls = "0.1.0"
mshv-bindings = "0.6.9"
mshv-ioctls = "0.6.9"
vfio_user = { version = "0.1.3", default-features = false }
vhost = { version = "0.16.0", default-features = false }
vhost-user-backend = { version = "0.22.0", default-features = false }

# igvm crates
igvm = "0.4.0"
igvm_defs = "0.4.0"

# serde crates
serde_with = { version = "3.18.0", default-features = false }

# other crates
bitflags = "2.11.1"
bytes = "1.4.0"
byteorder = "1.5.0"
caps = "^0.5.3"
dhat = "0.3.3"
dirs = "6.0.0"
downcast-rs = "2.0.1"
env_logger = "0.11.10"
epoll = "4.4.0"
flume = "0.12.0"
fuse-backend-rs = { git = "https://github.com/adfxj/fuse-backend-rs.git", branch = "restore-new", package = "fuse-backend-rs", features = [
    "virtiofs",
    "fusedev",
    "persist",
] }
itertools = "0.14.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }
nydus-api = { git = "https://github.com/adfxj/nydus", branch = "restore-new", package = "nydus-api", features = [
    "error-backtrace",
    "handler",
] }
nydus-rafs = { git = "https://github.com/adfxj/nydus", branch = "restore-new", package = "nydus-rafs", features = ["virtio-fs"] }
nydus-storage = { git = "https://github.com/adfxj/nydus", branch = "restore-new", package = "nydus-storage", features = [
    "prefetch-rate-limit",
] }
rlimit = "0.7.0"
sendfd = "0.4.3"
signal-hook = "0.4.4"
threadpool = "1"
uuid = { version = "1.23.1" }
wait-timeout = "0.2.1"
zerocopy = { version = "0.8.48", default-features = false }

# Local dependencies from Dragonball Sandbox crates
dragonball = { path = "src/dragonball" }
dbs-acpi = { path = "src/dragonball/dbs_acpi" }
dbs-address-space = { path = "src/dragonball/dbs_address_space" }
dbs-allocator = { path = "src/dragonball/dbs_allocator" }
dbs-arch = { path = "src/dragonball/dbs_arch" }
dbs-boot = { path = "src/dragonball/dbs_boot" }
dbs-device = { path = "src/dragonball/dbs_device" }
dbs-interrupt = { path = "src/dragonball/dbs_interrupt" }
dbs-legacy-devices = { path = "src/dragonball/dbs_legacy_devices" }
dbs-pci = { path = "src/dragonball/dbs_pci" }
dbs-tdx = { path = "src/dragonball/dbs_tdx" }
dbs-upcall = { path = "src/dragonball/dbs_upcall" }
dbs-utils = { path = "src/dragonball/dbs_utils" }
dbs-virtio-devices = { path = "src/dragonball/dbs_virtio_devices" }

# Local dependencies from cloud-hypervisor Sandbox crates
hypervisor = { path = "src/cloud-hypervisor/hypervisor" }
vmm = { path = "src/cloud-hypervisor/vmm" }

# Local dependencies from runtime-rs
agent = { path = "src/runtime-rs/crates/agent" }
kata-hypervisor = { path = "src/runtime-rs/crates/hypervisor" }
persist = { path = "src/runtime-rs/crates/persist" }
resource = { path = "src/runtime-rs/crates/resource" }
runtimes = { path = "src/runtime-rs/crates/runtimes" }
service = { path = "src/runtime-rs/crates/service" }
tests_utils = { path = "src/runtime-rs/tests/utils" }
common = { path = "src/runtime-rs/crates/runtimes/common" }
linux_container = { path = "src/runtime-rs/crates/runtimes/linux_container" }
virt_container = { path = "src/runtime-rs/crates/runtimes/virt_container" }
wasm_container = { path = "src/runtime-rs/crates/runtimes/wasm_container" }

# Local dependencies from `src/lib`
kata-sys-util = { path = "src/libs/kata-sys-util" }
pod-resources-rs = { path = "src/libs/pod-resources-rs" }
kata-types = { path = "src/libs/kata-types", features = ["safe-path"] }
logging = { path = "src/libs/logging" }
mem-agent = { path = "src/libs/mem-agent" }
protocols = { path = "src/libs/protocols", features = ["async"] }
runtime-spec = { path = "src/libs/runtime-spec" }
safe-path = { path = "src/libs/safe-path" }
shim-interface = { path = "src/libs/shim-interface" }
test-utils = { path = "src/libs/test-utils" }

# Local dependencies from `src/agent`
kata-agent-policy = { path = "src/agent/policy" }
rustjail = { path = "src/agent/rustjail" }
vsock-exporter = { path = "src/agent/vsock-exporter" }

# Outside dependencies
actix-rt = "2.7.0"
anyhow = "1.0"
base64 = "0.22"
async-recursion = "0.3.2"
async-trait = "0.1.48"
bilge = "0.3.0"
capctl = "0.2.0"
cfg-if = "1.0.0"
cgroups = { package = "cgroups-rs", git = "https://github.com/kata-containers/cgroups-rs", rev = "v0.3.5" }
clap = { version = "4.5.40", features = ["derive"] }
const_format = "0.2.30"
containerd-shim = { version = "0.10.0", features = ["async"] }
containerd-shim-protos = { version = "0.10.0", features = ["async"] }
derivative = "2.2.0"
futures = "0.3.30"
go-flag = "0.1.0"
hyper = "0.14.20"
hyperlocal = "0.8.0"
ipnetwork = "0.17.0"
lazy_static = "1.4"
libc = "0.2.94"
log = "0.4.14"
netlink-packet-core = "0.7.0"
netlink-packet-route = "0.19.0"
netlink-sys = { version = "0.7.0", features = ["tokio_socket"] }
netns-rs = "0.1.0"
# Note: nix needs to stay sync'd with libs versions
nix = "0.26.4"
oci-spec = { version = "0.8.1", features = ["runtime"] }
opentelemetry = { version = "0.17.0", features = ["rt-tokio"] }
procfs = "0.12.0"
prometheus = { version = "0.14.0", features = ["process"] }
protobuf = "3.7.2"
rand = "0.10.1"
regex = "1.10.5"
rstest = "0.18.0"
rtnetlink = "0.14.0"
scan_fmt = "0.2.6"
scopeguard = "1.0.0"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.91"
serial_test = "0.10.0"
sha2 = "0.10.9"
slog = "2.5.2"
slog-scope = "4.4.0"
slog-stdlog = "4.0.0"
slog-term = "2.9.0"
strum = { version = "0.24.0", features = ["derive"] }
strum_macros = "0.26.2"
tempfile = "3.19.1"
thiserror = "1.0.26"
tokio = "1.46.1"
tokio-vsock = "0.3.4"
toml = "0.5.8"
tracing = "0.1.44"
tracing-opentelemetry = "0.18.0"
tracing-subscriber = "0.3.20"
ttrpc = "0.8.4"
url = "2.5.4"
which = "4.3.0"

[workspace.lints.clippy]
# Any clippy lint (group) in alphabetical order:
# https://rust-lang.github.io/rust-clippy/master/index.html

# Groups
all = "deny"         # shorthand for the other groups but here for compleness
complexity = "deny"
correctness = "deny"
perf = "deny"
style = "deny"
suspicious = "deny"

# Individual Lints
assertions_on_result_states = "deny"
if_not_else = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
needless_pass_by_value = "deny"
redundant_else = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
uninlined_format_args = "deny"
unnecessary_semicolon = "deny"

[workspace.lints.rust]
# `level = warn` is irrelevant here but mandatory for rustc/cargo
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(devcli_testenv)'] }

# Per-package release profile overrides for kata-deploy. The kata-deploy
# binary runs once at pod start and then idles waiting for SIGTERM, so we
# size-optimise it (opt-level = "z") and keep codegen-units = 1 to give
# the optimiser the whole picture. These overrides only affect the
# kata-deploy crate; agent / runtime-rs / dragonball compile with their
# usual defaults.
[profile.release.package."kata-deploy"]
opt-level = "z"
codegen-units = 1
