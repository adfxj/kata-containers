apiVersion: v1
kind: Pod
metadata:
  name: test-pod-hostname
spec:
  runtimeClassName: kata
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [10]
  restartPolicy: Never
  containers:
  - image: quay.io/prometheus/busybox:latest
    name: pod-hostname-c01
    command: ["sh"]
    args: ["-c", "hostname"]
