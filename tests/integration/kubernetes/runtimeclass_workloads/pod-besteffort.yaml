apiVersion: v1
kind: Pod
metadata:
  name: besteffort-test
spec:
  runtimeClassName: kata
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [10]
  containers:
  - name: qos-besteffort
    image: quay.io/prometheus/busybox:latest
    command: ["/bin/sh", "-c", "tail -f /dev/null"]
